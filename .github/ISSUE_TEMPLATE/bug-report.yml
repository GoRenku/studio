name: Bug report
description: Something in Renku Studio, the renku command line, the installer or an agent workflow is not working
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, tokens and private project media before you paste anything here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: version
    attributes:
      label: Renku version
      description: Paste the output of `renku about`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex desktop app
        - Codex CLI
        - Claude Desktop Code tab
        - Claude Code in a terminal
        - Another agent
        - Not agent-related
  - type: input
    id: provider-model
    attributes:
      label: Provider and model, if a generation failed
  - type: textarea
    id: error-output
    attributes:
      label: Error output
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed API keys, tokens and private project content
          required: true
