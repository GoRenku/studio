name: Release beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version
        required: true
      publish:
        description: Publish verified artifacts to the existing R2 bucket
        required: true
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
            flavor: node22
            node-version: 22.12.0
          - runner: macos-14
            target: darwin-arm64
            flavor: node24
            node-version: 24.16.0
          - runner: macos-14
            target: darwin-arm64
            flavor: bundled-node24
            node-version: 24.16.0
          - runner: macos-15-intel
            target: darwin-x64
            flavor: node22
            node-version: 22.12.0
          - runner: macos-15-intel
            target: darwin-x64
            flavor: node24
            node-version: 24.16.0
          - runner: macos-15-intel
            target: darwin-x64
            flavor: bundled-node24
            node-version: 24.16.0
          - runner: windows-2025
            target: win32-x64
            flavor: node22
            node-version: 22.12.0
          - runner: windows-2025
            target: win32-x64
            flavor: node24
            node-version: 24.16.0
          - runner: windows-2025
            target: win32-x64
            flavor: bundled-node24
            node-version: 24.16.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: studio
      - uses: actions/checkout@v4
        with:
          repository: GoRenku/studio-skills
          path: studio-skills
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - name: Download private Node runtime
        if: matrix.flavor == 'bundled-node24'
        id: bundled-node
        shell: bash
        run: |
          node studio/scripts/release/download-node-runtime.mjs "${{ matrix.target }}" "$RUNNER_TEMP/renku-node" > "$RUNNER_TEMP/node-path.txt"
          echo "path=$(cat "$RUNNER_TEMP/node-path.txt")" >> "$GITHUB_OUTPUT"
      - name: Assemble product with external Node
        if: matrix.flavor != 'bundled-node24'
        shell: bash
        run: >-
          node scripts/release/assemble-product.mjs
          --version "${{ inputs.version }}"
          --target "${{ matrix.target }}"
          --flavor "${{ matrix.flavor }}"
          --skills-dir "../studio-skills"
        working-directory: studio
      - name: Assemble product with private Node
        if: matrix.flavor == 'bundled-node24'
        shell: bash
        run: >-
          node scripts/release/assemble-product.mjs
          --version "${{ inputs.version }}"
          --target "${{ matrix.target }}"
          --flavor "${{ matrix.flavor }}"
          --skills-dir "../studio-skills"
          --bundled-node-dir "${{ steps.bundled-node.outputs.path }}"
        working-directory: studio
      - name: Verify and package
        shell: bash
        run: |
          PRODUCT="release/staging/renku-${{ inputs.version }}-${{ matrix.target }}-${{ matrix.flavor }}"
          node scripts/release/verify-product.mjs "$PRODUCT/renku"
          node scripts/release/package-product.mjs "$PRODUCT" "release/artifacts/${{ matrix.target }}/${{ matrix.flavor }}"
        working-directory: studio
      - uses: actions/upload-artifact@v4
        with:
          name: renku-${{ matrix.target }}-${{ matrix.flavor }}
          path: studio/release/artifacts

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: beta-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release/artifacts
          pattern: renku-*
          merge-multiple: true
      - run: node scripts/release/publish-r2.mjs --version "${{ inputs.version }}" --release-dir release/artifacts
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
